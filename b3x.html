<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe873">
<meta name="color-scheme" content="light">
<title>B3X 实时到站｜红桥 ⇄ 深圳湾口岸</title>
<style>
  :root {
    --bg: #ffe873;
    --ink: #3b2f00;
    --soft: #7a6a24;
    --line: rgba(59, 47, 0, .16);
    --dark: #1f2937;
    --pink: #cf3563;
    --red: #a32b1f;
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  .app {
    width: min(100%, 420px);
    text-align: center;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .route {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 66px;
    padding: 7px 14px;
    border-radius: 10px;
    background: var(--dark);
    color: var(--bg);
    font-size: 21px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: .02em;
  }

  .refresh {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, opacity .15s;
  }

  .refresh:hover { background: rgba(255, 255, 255, .45); }
  .refresh:active { transform: scale(.97); }
  .refresh:disabled { opacity: .5; cursor: default; }
  .refresh:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 20px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .seg-btn {
    appearance: none;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--soft);
    padding: 10px 6px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: .01em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .18s, color .18s;
  }

  .seg-btn:hover { background: rgba(255, 255, 255, .38); }

  .seg-btn.is-active {
    background: var(--dark);
    color: var(--bg);
  }

  .seg-btn.is-active:hover { background: var(--dark); }

  .seg-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .list {
    margin-top: 22px;
    border-top: 1px solid var(--line);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 120px 54px;
    align-items: baseline;
    gap: 12px;
    padding: 16px 2px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }

  .row[hidden] { display: none; }

  .row-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--soft);
  }

  .row-min {
    min-width: 0;
    text-align: right;
    font-size: 27px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }

  .row-min small {
    margin-left: 4px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--soft);
  }

  .row-at {
    min-width: 0;
    text-align: right;
    font-size: 14px;
    font-weight: 600;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }

  .row.is-next .row-label { color: var(--ink); }
  .row.is-next .row-min { color: var(--pink); }
  .row.is-next .row-min small { color: var(--pink); }

  .row-min.is-now { font-size: 18px; letter-spacing: 0; }

  .status {
    margin: 22px 0 0;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }

  .status.is-error { color: var(--red); font-weight: 700; }

  @media (max-width: 360px) {
    body { padding: 20px 16px calc(22px + env(safe-area-inset-bottom)); }
    .seg { margin-top: 16px; }
    .seg-btn { font-size: 11.5px; padding: 9px 4px; }
    .list { margin-top: 18px; }
    .row { grid-template-columns: 1fr 104px 50px; gap: 9px; padding: 14px 1px; }
    .row-min { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .refresh, .seg-btn { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="route" aria-label="班次 B3X">B3X</span>
    <button class="refresh" id="refreshBtn" type="button">刷新</button>
  </div>

  <div class="seg" role="group" aria-label="选择查询方向">
    <button class="seg-btn is-active" id="segOut" type="button" aria-pressed="true">红桥 → 深圳湾口岸</button>
    <button class="seg-btn" id="segBack" type="button" aria-pressed="false">深圳湾口岸 → 红桥</button>
  </div>

  <section class="list" id="list" aria-label="实时到站时间">
    <div class="row is-next" id="row1">
      <span class="row-label">下一班</span>
      <span class="row-min"><b id="min1">--</b><small id="unit1">分钟</small></span>
      <span class="row-at" id="at1">--:--</span>
    </div>
    <div class="row" id="row2">
      <span class="row-label">第 2 班</span>
      <span class="row-min"><b id="min2">--</b><small id="unit2">分钟</small></span>
      <span class="row-at" id="at2">--:--</span>
    </div>
    <div class="row" id="row3">
      <span class="row-label">第 3 班</span>
      <span class="row-min"><b id="min3">--</b><small id="unit3">分钟</small></span>
      <span class="row-at" id="at3">--:--</span>
    </div>
  </section>

  <p class="status" id="status" role="status">正在获取…</p>
</main>

<script>
(() => {
  "use strict";

  const API_BASE = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB";
  const ROUTE = "B3X";
  const REFRESH_MS = 30_000;
  const TIMEOUT_MS = 12_000;
  const MAX_BUSES = 3;
  const STORAGE_KEY = "b3x-view";

  const VIEWS = {
    out: { stop: "003192", dir: "O", hash: "out" },
    back: { stop: "003208", dir: "I", hash: "back" }
  };

  const el = {
    rows: [1, 2, 3].map(i => ({
      row: document.getElementById(`row${i}`),
      wrap: document.querySelector(`#row${i} .row-min`),
      num: document.getElementById(`min${i}`),
      unit: document.getElementById(`unit${i}`),
      at: document.getElementById(`at${i}`)
    })),
    status: document.getElementById("status"),
    btn: document.getElementById("refreshBtn"),
    segOut: document.getElementById("segOut"),
    segBack: document.getElementById("segBack")
  };

  const clockFmt = new Intl.DateTimeFormat("zh-HK", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  const state = {
    view: "out",
    cache: {
      out: { arrivals: [], updatedAt: null, hasData: false, error: false },
      back: { arrivals: [], updatedAt: null, hasData: false, error: false }
    },
    inFlight: false,
    requestId: 0,
    nextAt: Date.now() + REFRESH_MS
  };

  function clock(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "--:--" : clockFmt.format(date);
  }

  function minutesLeft(eta) {
    return Math.floor((Date.parse(eta) - Date.now()) / 60_000);
  }

  function current() {
    return state.cache[state.view];
  }

  function pickUpcoming(data, stop, dir) {
    const now = Date.now();
    const seen = new Set();
    return (Array.isArray(data) ? data : [])
      .filter(item => item && item.eta && item.route === ROUTE &&
        item.stop === stop && item.dir === dir)
      .map(item => item.eta)
      .filter(eta => {
        const time = Date.parse(eta);
        if (!Number.isFinite(time) || time < now - 120_000) return false;
        if (seen.has(time)) return false;
        seen.add(time);
        return true;
      })
      .sort((a, b) => Date.parse(a) - Date.parse(b))
      .slice(0, MAX_BUSES);
  }

  function renderRows() {
    const { arrivals } = current();

    el.rows.forEach((slot, index) => {
      const eta = arrivals[index];
      slot.row.hidden = index > 0 && !eta;
      slot.wrap.classList.remove("is-now");
      slot.unit.hidden = false;

      if (!eta) {
        slot.num.textContent = "--";
        slot.unit.textContent = "分钟";
        slot.at.textContent = "--:--";
        return;
      }

      const left = minutesLeft(eta);
      if (left <= 1) {
        slot.num.textContent = "即将到站";
        slot.wrap.classList.add("is-now");
        slot.unit.hidden = true;
      } else {
        slot.num.textContent = String(Math.max(1, left));
        slot.unit.textContent = "分钟";
      }
      slot.at.textContent = clock(eta);
    });
  }

  function renderStatus() {
    const view = current();
    el.status.classList.toggle("is-error", view.error);

    if (view.error) {
      el.status.textContent = view.hasData
        ? "连接失败 · 显示上次数据"
        : "连接失败 · 请检查网络后刷新";
      return;
    }

    if (!view.updatedAt) {
      el.status.textContent = "正在获取…";
      return;
    }

    const stamp = clock(view.updatedAt);
    el.status.textContent = view.arrivals.length
      ? `${stamp} 更新 · 每 30 秒自动刷新`
      : `${stamp} 更新 · 暂无班次`;
  }

  function renderSeg() {
    const isOut = state.view === "out";
    el.segOut.classList.toggle("is-active", isOut);
    el.segBack.classList.toggle("is-active", !isOut);
    el.segOut.setAttribute("aria-pressed", String(isOut));
    el.segBack.setAttribute("aria-pressed", String(!isOut));
  }

  function paint() {
    Object.values(state.cache).forEach(view => {
      view.arrivals = view.arrivals.filter(eta => Date.parse(eta) > Date.now() - 60_000);
    });
    renderSeg();
    renderRows();
    renderStatus();
  }

  function setView(next) {
    if (!VIEWS[next] || next === state.view) return;
    state.view = next;
    try { localStorage.setItem(STORAGE_KEY, next); } catch (error) { /* ignore */ }
    try { history.replaceState(null, "", `#${VIEWS[next].hash}`); } catch (error) { /* ignore */ }
    state.nextAt = Date.now() + REFRESH_MS;
    paint();
    load();
  }

  async function load() {
    if (state.inFlight) return;

    state.inFlight = true;
    const viewName = state.view;
    const view = VIEWS[viewName];
    const bucket = state.cache[viewName];
    const requestId = ++state.requestId;

    el.btn.disabled = true;
    el.btn.textContent = "刷新中";

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const response = await fetch(`${API_BASE}/${view.stop}/${ROUTE}?t=${Date.now()}`, {
        cache: "no-store",
        signal: controller.signal,
        headers: { Accept: "application/json" }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const payload = await response.json();
      if (requestId !== state.requestId) return;

      bucket.arrivals = pickUpcoming(payload.data, view.stop, view.dir);
      bucket.error = false;
      bucket.updatedAt = new Date();
      bucket.hasData = true;
    } catch (error) {
      if (requestId !== state.requestId) return;
      bucket.error = true;
    } finally {
      clearTimeout(timer);
      state.inFlight = false;
      if (requestId === state.requestId) {
        state.nextAt = Date.now() + REFRESH_MS;
        el.btn.disabled = false;
        el.btn.textContent = "刷新";
        paint();
        if (state.view !== viewName) load();
      }
    }
  }

  function initialView() {
    const fromHash = location.hash.replace("#", "");
    if (fromHash === VIEWS.out.hash) return "out";
    if (fromHash === VIEWS.back.hash) return "back";
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === "out" || saved === "back") return saved;
    } catch (error) { /* ignore */ }
    return "out";
  }

  el.segOut.addEventListener("click", () => setView("out"));
  el.segBack.addEventListener("click", () => setView("back"));

  el.btn.addEventListener("click", () => {
    state.nextAt = Date.now() + REFRESH_MS;
    load();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() >= state.nextAt) {
      load();
    }
  });

  window.addEventListener("hashchange", () => {
    const hash = location.hash.replace("#", "");
    if (hash === VIEWS.back.hash) setView("back");
    else if (hash === VIEWS.out.hash) setView("out");
  });

  setInterval(() => {
    paint();
    if (!state.inFlight && Date.now() >= state.nextAt) load();
  }, 1000);

  state.view = initialView();
  paint();
  load();
})();
</script>
</body>
</html>
