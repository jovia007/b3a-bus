<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe873">
<meta name="color-scheme" content="light">
<title>B3A 实时到站｜富泰邨 → 深圳湾口岸</title>
<style>
  :root {
    --bg: #ffe873;
    --ink: #3b2f00;
    --soft: #7a6a24;
    --line: rgba(59, 47, 0, .16);
    --dark: #1f2937;
    --red: #a32b1f;
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  .app {
    width: min(100%, 420px);
    text-align: center;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .route {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 66px;
    padding: 7px 14px;
    border-radius: 10px;
    background: var(--dark);
    color: var(--bg);
    font-size: 21px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: .02em;
  }

  .refresh {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, opacity .15s;
  }

  .refresh:hover { background: rgba(255, 255, 255, .45); }
  .refresh:active { transform: scale(.97); }
  .refresh:disabled { opacity: .5; cursor: default; }
  .refresh:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .dir {
    margin: 14px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--soft);
  }

  .board { margin-top: 34px; }

  .label {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--soft);
  }

  .time {
    margin: 0;
    font-size: clamp(76px, 25vw, 104px);
    font-weight: 900;
    line-height: .92;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
  }

  .until {
    margin: 14px 0 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .01em;
    color: #5c4c0c;
  }

  .status {
    margin: 34px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }

  .status.is-error { color: var(--red); font-weight: 700; }

  @media (max-width: 360px) {
    body { padding: 20px 16px calc(22px + env(safe-area-inset-bottom)); }
    .time { font-size: clamp(64px, 23vw, 88px); }
    .until { font-size: 22px; }
    .board { margin-top: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .refresh { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="route" aria-label="班次 B3A">B3A</span>
    <button class="refresh" id="refreshBtn" type="button">刷新</button>
  </div>

  <p class="dir">富泰邨 → 深圳湾口岸</p>

  <section class="board" aria-live="polite">
    <p class="label">预计到站</p>
    <p class="time" id="etaTime">--:--</p>
    <p class="until" id="etaUntil">正在获取…</p>
  </section>

  <p class="status" id="status">正在获取…</p>
</main>

<script>
(() => {
  "use strict";

  const API_URL = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/003261/B3A";
  const STOP_ID = "003261";
  const ROUTE = "B3A";
  const DIRECTION = "O";
  const REFRESH_MS = 30_000;
  const TIMEOUT_MS = 12_000;

  const el = {
    time: document.getElementById("etaTime"),
    until: document.getElementById("etaUntil"),
    status: document.getElementById("status"),
    btn: document.getElementById("refreshBtn")
  };

  const clockFmt = new Intl.DateTimeFormat("zh-HK", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  const state = {
    eta: null,
    loading: true,
    hasData: false,
    error: false,
    updatedAt: null,
    nextAt: Date.now() + REFRESH_MS,
    inFlight: false,
    requestId: 0
  };

  function clock(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "--:--" : clockFmt.format(date);
  }

  function nextEta(data) {
    const now = Date.now();
    const seen = new Set();
    return (Array.isArray(data) ? data : [])
      .filter(item => item && item.eta && item.route === ROUTE &&
        item.stop === STOP_ID && item.dir === DIRECTION)
      .map(item => item.eta)
      .filter(eta => {
        const time = Date.parse(eta);
        if (!Number.isFinite(time) || time < now - 120_000) return false;
        if (seen.has(time)) return false;
        seen.add(time);
        return true;
      })
      .sort((a, b) => Date.parse(a) - Date.parse(b))[0] || null;
  }

  function paint() {
    if (state.eta) {
      el.time.textContent = clock(state.eta);
      const diff = Date.parse(state.eta) - Date.now();
      el.until.textContent = diff <= 60_000
        ? "即将到站"
        : `约 ${Math.max(1, Math.floor(diff / 60_000))} 分钟`;
    } else {
      el.time.textContent = "--:--";
      if (state.loading && !state.hasData) {
        el.until.textContent = "正在获取…";
      } else if (state.error) {
        el.until.textContent = "暂无数据";
      } else {
        el.until.textContent = "暂无班次";
      }
    }

    el.status.classList.toggle("is-error", state.error);
    if (state.error) {
      el.status.textContent = state.hasData
        ? "连接失败 · 显示上次数据"
        : "连接失败 · 请检查网络后刷新";
    } else if (state.updatedAt) {
      el.status.textContent = `${clock(state.updatedAt)} 更新 · 每 30 秒自动刷新`;
    } else {
      el.status.textContent = "正在获取…";
    }
  }

  async function load() {
    if (state.inFlight) return;
    state.inFlight = true;
    state.loading = true;
    el.btn.disabled = true;
    el.btn.textContent = "刷新中";

    const requestId = ++state.requestId;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const response = await fetch(`${API_URL}?t=${Date.now()}`, {
        cache: "no-store",
        signal: controller.signal,
        headers: { Accept: "application/json" }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const payload = await response.json();
      if (requestId !== state.requestId) return;

      state.eta = nextEta(payload.data);
      state.error = false;
      state.updatedAt = new Date();
      state.hasData = true;
    } catch (error) {
      if (requestId !== state.requestId) return;
      state.error = true;
    } finally {
      clearTimeout(timer);
      state.inFlight = false;
      if (requestId === state.requestId) {
        state.loading = false;
        state.nextAt = Date.now() + REFRESH_MS;
        el.btn.disabled = false;
        el.btn.textContent = "刷新";
        paint();
      }
    }
  }

  el.btn.addEventListener("click", () => {
    state.nextAt = Date.now() + REFRESH_MS;
    load();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() >= state.nextAt) {
      load();
    }
  });

  setInterval(() => {
    paint();
    if (!state.inFlight && Date.now() >= state.nextAt) load();
  }, 1000);

  paint();
  load();
})();
</script>
</body>
</html>
