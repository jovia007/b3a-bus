<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe873">
<meta name="color-scheme" content="light">
<title>B3A 实时到站｜富泰邨 → 深圳湾口岸</title>
<style>
  :root {
    --bg: #ffe873;
    --ink: #3b2f00;
    --soft: #7a6a24;
    --line: rgba(59, 47, 0, .16);
    --dark: #1f2937;
    --green: #0f7a4a;
    --red: #a32b1f;
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  .app {
    width: min(100%, 420px);
    text-align: center;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .route {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 66px;
    padding: 7px 14px;
    border-radius: 10px;
    background: var(--dark);
    color: var(--bg);
    font-size: 21px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: .02em;
  }

  .refresh {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    padding: 9px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, opacity .15s;
  }

  .refresh:hover { background: rgba(255, 255, 255, .45); }
  .refresh:active { transform: scale(.97); }
  .refresh:disabled { opacity: .5; cursor: default; }
  .refresh:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .dir {
    margin: 14px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--soft);
  }

  .board { margin-top: 26px; }

  .ring {
    position: relative;
    width: 210px;
    height: 210px;
    margin: 0 auto;
  }

  .ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring circle {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
  }

  .ring .track { stroke: rgba(59, 47, 0, .13); }

  .ring .bar {
    stroke: var(--ink);
    stroke-dasharray: 464.96;
    stroke-dashoffset: 464.96;
    transition: stroke-dashoffset .9s linear, stroke .3s;
  }

  .ring.is-close .bar { stroke: var(--green); }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .num {
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }

  .unit {
    font-size: 15px;
    font-weight: 700;
    color: #5c4c0c;
  }

  .ring.is-now .num { font-size: 24px; letter-spacing: 0; }
  .ring.is-now .unit { display: none; }

  .eta-line {
    margin: 14px 0 0;
    font-size: 17px;
    font-weight: 700;
    color: #6b5b1b;
    font-variant-numeric: tabular-nums;
  }

  .later {
    margin-top: 26px;
    border-top: 1px solid var(--line);
  }

  .later-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 2px;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }

  .later-row + .later-row { border-top: 1px solid var(--line); }

  .row-label { font-size: 13px; font-weight: 700; color: var(--soft); }
  .row-time { font-size: 16px; font-weight: 600; color: var(--soft); }
  .row-min { font-size: 21px; font-weight: 800; color: #4a3c05; }

  .status {
    margin: 26px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }

  .status.is-error { color: var(--red); font-weight: 700; }

  @media (max-width: 360px) {
    body { padding: 20px 16px calc(22px + env(safe-area-inset-bottom)); }
    .ring { width: 180px; height: 180px; }
    .num { font-size: 62px; }
    .board { margin-top: 22px; }
    .later-row { gap: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .refresh, .ring .bar { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <span class="route" aria-label="班次 B3A">B3A</span>
    <button class="refresh" id="refreshBtn" type="button">刷新</button>
  </div>

  <p class="dir">富泰邨 → 深圳湾口岸</p>

  <section class="board" aria-label="实时到站时间">
    <div class="ring" id="ring">
      <svg viewBox="0 0 176 176" aria-hidden="true">
        <circle class="track" cx="88" cy="88" r="74"></circle>
        <circle class="bar" id="ringBar" cx="88" cy="88" r="74"></circle>
      </svg>
      <div class="ring-text">
        <span class="num" id="nextMin">--</span>
        <span class="unit" id="nextUnit">分钟</span>
      </div>
    </div>

    <p class="eta-line" id="nextClock">正在获取…</p>

    <div class="later" id="later"></div>
  </section>

  <p class="status" id="status" role="status">正在获取…</p>
</main>

<script>
(() => {
  "use strict";

  const API_URL = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/003261/B3A";
  const STOP_ID = "003261";
  const ROUTE = "B3A";
  const DIRECTION = "O";
  const REFRESH_MS = 30_000;
  const TIMEOUT_MS = 12_000;
  const MAX_BUSES = 3;
  const RING_LEN = 2 * Math.PI * 74;
  const FULL_MINUTES = 30;
  const CLOSE_MINUTES = 5;

  const el = {
    ring: document.getElementById("ring"),
    bar: document.getElementById("ringBar"),
    min: document.getElementById("nextMin"),
    unit: document.getElementById("nextUnit"),
    clock: document.getElementById("nextClock"),
    later: document.getElementById("later"),
    status: document.getElementById("status"),
    btn: document.getElementById("refreshBtn")
  };

  const clockFmt = new Intl.DateTimeFormat("zh-HK", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  const state = {
    arrivals: [],
    loading: true,
    hasData: false,
    error: false,
    updatedAt: null,
    nextAt: Date.now() + REFRESH_MS,
    inFlight: false,
    requestId: 0
  };

  function clock(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "--:--" : clockFmt.format(date);
  }

  function minutesLeft(eta) {
    return Math.floor((Date.parse(eta) - Date.now()) / 60_000);
  }

  function pickUpcoming(data) {
    const now = Date.now();
    const seen = new Set();
    return (Array.isArray(data) ? data : [])
      .filter(item => item && item.eta && item.route === ROUTE &&
        item.stop === STOP_ID && item.dir === DIRECTION)
      .map(item => item.eta)
      .filter(eta => {
        const time = Date.parse(eta);
        if (!Number.isFinite(time) || time < now - 120_000) return false;
        if (seen.has(time)) return false;
        seen.add(time);
        return true;
      })
      .sort((a, b) => Date.parse(a) - Date.parse(b))
      .slice(0, MAX_BUSES);
  }

  function rowMarkup(eta, index) {
    const left = minutesLeft(eta);
    const text = left <= 1 ? "即将到站" : `${left} 分钟`;
    return `<div class="later-row">
      <span class="row-label">第 ${index} 班</span>
      <span class="row-time">${clock(eta)}</span>
      <span class="row-min">${text}</span>
    </div>`;
  }

  function setRing(minutes) {
    const ratio = Math.max(0, Math.min(1, 1 - minutes / FULL_MINUTES));
    el.bar.style.strokeDashoffset = String(RING_LEN * (1 - ratio));
  }

  function renderHero() {
    const next = state.arrivals[0];

    if (!next) {
      el.ring.classList.remove("is-now", "is-close");
      setRing(FULL_MINUTES);
      el.min.textContent = "--";
      el.unit.textContent = "分钟";
      el.clock.textContent = state.loading && !state.hasData
        ? "正在获取…"
        : state.error ? "暂无数据" : "暂无班次";
      return;
    }

    const left = minutesLeft(next);
    const soon = left <= 1;
    el.ring.classList.toggle("is-now", soon);
    el.ring.classList.toggle("is-close", left <= CLOSE_MINUTES);
    setRing(Math.max(left, 0));

    el.min.textContent = soon ? "即将到站" : String(Math.max(1, left));
    el.unit.textContent = "分钟";
    el.clock.textContent = `${clock(next)} 到站`;
  }

  function renderLater() {
    const later = state.arrivals.slice(1);
    el.later.innerHTML = later.map((eta, i) => rowMarkup(eta, i + 2)).join("");
    el.later.hidden = later.length === 0;
  }

  function renderStatus() {
    el.status.classList.toggle("is-error", state.error);
    if (state.error) {
      el.status.textContent = state.hasData
        ? "连接失败 · 显示上次数据"
        : "连接失败 · 请检查网络后刷新";
    } else if (state.updatedAt) {
      el.status.textContent = `${clock(state.updatedAt)} 更新 · 每 30 秒自动刷新`;
    } else {
      el.status.textContent = "正在获取…";
    }
  }

  function paint() {
    state.arrivals = state.arrivals.filter(eta => Date.parse(eta) > Date.now() - 60_000);
    renderHero();
    renderLater();
    renderStatus();
  }

  async function load() {
    if (state.inFlight) return;
    state.inFlight = true;
    state.loading = true;
    el.btn.disabled = true;
    el.btn.textContent = "刷新中";

    const requestId = ++state.requestId;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const response = await fetch(`${API_URL}?t=${Date.now()}`, {
        cache: "no-store",
        signal: controller.signal,
        headers: { Accept: "application/json" }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const payload = await response.json();
      if (requestId !== state.requestId) return;

      state.arrivals = pickUpcoming(payload.data);
      state.error = false;
      state.updatedAt = new Date();
      state.hasData = true;
    } catch (error) {
      if (requestId !== state.requestId) return;
      state.error = true;
    } finally {
      clearTimeout(timer);
      state.inFlight = false;
      if (requestId === state.requestId) {
        state.loading = false;
        state.nextAt = Date.now() + REFRESH_MS;
        el.btn.disabled = false;
        el.btn.textContent = "刷新";
        paint();
      }
    }
  }

  el.btn.addEventListener("click", () => {
    state.nextAt = Date.now() + REFRESH_MS;
    load();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() >= state.nextAt) {
      load();
    }
  });

  setInterval(() => {
    paint();
    if (!state.inFlight && Date.now() >= state.nextAt) load();
  }, 1000);

  paint();
  load();
})();
</script>
</body>
</html>
